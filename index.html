<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tracker PRO</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1220;
      color: white;
    }

    .topbar {
      padding: 15px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #1f2937;
    }

    #map {
      height: 70vh;
      margin: 10px;
      border-radius: 15px;
    }

    .controls {
      padding: 10px;
      text-align: center;
    }

    button {
      padding: 12px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 45%;
      font-weight: bold;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .sos {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div>📍 Family Tracker PRO</div>
  <div class="status" id="status">Offline</div>
</div>

<div id="map"></div>

<div class="controls">
  <button class="start" onclick="startTracking()">Start Tracking</button>
  <button class="sos" onclick="sendSOS()">SOS</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const BIN_ID = "6a01c74a250b1311c333bb63";
const API_KEY = "YOUR_MASTER_KEY_HERE";

let map;
let marker;
let watchId = null;

function initMap() {
  map = L.map('map').setView([6.5244, 3.3792], 13);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  marker = L.marker([6.5244, 3.3792]).addTo(map);
}

initMap();

function startTracking() {

  document.getElementById("status").innerText = "Requesting GPS...";

  if (!navigator.geolocation) {
    alert("GPS not supported on this device");
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    async (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      document.getElementById("status").innerText = "LIVE";

      marker.setLatLng([lat, lng]);
      map.setView([lat, lng]);

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
          },
          body: JSON.stringify({
            location: {
              lat,
              lng,
              time: new Date().toISOString()
            }
          })
        });
      } catch (err) {
        console.log("Save error:", err);
      }

    },
    (err) => {
      document.getElementById("status").innerText = "GPS blocked";
      alert("Location error: " + err.message);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }
  );
}

function sendSOS() {
  alert("🚨 SOS sent (upgrade later to real alert system)");
}

</script>

</body>
</html>
