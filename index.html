<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tracker PRO</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 15px;
      background: #111827;
      text-align: center;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    #map {
      height: 80vh;
      width: 100%;
    }

    .panel {
      padding: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h2>📍 Family Tracker PRO</h2>
</header>

<div class="panel">
  <button onclick="startTracking()">Start Tracking</button>
  <button onclick="sendSOS()">🚨 SOS</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const BIN_ID = "6a01c74a250b1311d808283c";
const API_KEY = "YOUR_MASTER_KEY";

let map;
let marker;

function initMap() {
  map = L.map('map').setView([6.5244, 3.3792], 13);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  marker = L.marker([6.5244, 3.3792]).addTo(map);
}

initMap();

function startTracking() {
  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    marker.setLatLng([lat, lng]);
    map.setView([lat, lng]);

    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      },
      body: JSON.stringify({
        location: { lat, lng, time: new Date() }
      })
    });

  });
}

function sendSOS() {
  alert("🚨 SOS Sent (you can upgrade this later)");
}
</script>

</body>
  </html>
